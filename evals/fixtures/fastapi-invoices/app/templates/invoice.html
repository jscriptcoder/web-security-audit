<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Invoice {{ invoice.number }}</title>
  <style>
    body { font-family: sans-serif; margin: 2rem; }
    table { border-collapse: collapse; width: 100%; }
    td, th { border-bottom: 1px solid #ddd; padding: .5rem; text-align: left; }
  </style>
</head>
<body>
  <h1>{{ invoice.company_name }}</h1>
  <p>Invoice <strong>{{ invoice.number }}</strong> issued {{ invoice.issued_at.date() }}</p>
  <p>Billed to {{ invoice.customer_name }} ({{ invoice.customer_email }})</p>
  <table>
    <tr><th>Description</th><th>Amount</th></tr>
    <tr><td>{{ invoice.description }}</td><td>{{ "%.2f"|format(invoice.total_cents / 100) }}</td></tr>
  </table>
  <p>Status: {{ invoice.status }}</p>
</body>
</html>
